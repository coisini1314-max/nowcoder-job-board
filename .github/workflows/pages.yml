name: 更新牛客岗位并发布看板

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/refresh.py
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'

permissions:
  contents: read

concurrency:
  group: nowcoder-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: 抓取并提交岗位数据
        if: github.event_name != 'push'
        run: |
          python3 scripts/refresh.py
          if git diff --quiet -- site/jobs.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/jobs.json
          git commit -m 'chore: refresh public Nowcoder jobs'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - name: 打包公开文件
        run: |
          mkdir public-site
          cp site/index.html site/style.css site/board.js site/keywords.json site/jobs.json public-site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
