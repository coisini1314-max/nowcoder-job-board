<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校招雷达 · 牛客岗位匹配</title>
<link rel="stylesheet" href="style.css">
<script defer src="board.js"></script>
</head>
<body>
<header class="bar">
  <div class="shell top"><div class="brand"><span class="mark">⌁</span> 校招雷达</div><a href="https://www.nowcoder.com/jobs/school/jobs" target="_blank" rel="noopener noreferrer">牛客校招 ↗</a></div>
</header>
<main class="shell">
  <section class="hero">
    <div class="eyebrow"><span></span> CAMPUS JOB TRACKER</div>
    <h1>今天，投哪些<span>？</span></h1>
    <p>把牛客公开岗位和你的简历逐份匹配。70 分起进入投递清单。</p>
    <div id="updated" class="muted" aria-live="polite">正在读取岗位数据…</div>
  </section>
  <section class="summary" aria-label="岗位概览">
    <div><span>当前岗位</span><strong id="total">—</strong></div>
    <div><span>待投清单 · ≥70</span><strong id="queue">—</strong></div>
    <div><span>已投递 · 本机</span><strong id="sent">—</strong></div>
    <div><span>简历版本 · 本机</span><strong id="versions">—</strong></div>
  </section>
  <section class="private" aria-label="本机简历档案">
    <div><strong id="profile-title">启用个人匹配</strong><p id="profile-note">导入本机关键词档案，档案和投递状态保存在当前浏览器。</p></div>
    <div class="actions"><label class="button secondary" for="profile-file">导入关键词档案</label><input id="profile-file" type="file" accept=".json,application/json" hidden><button id="forget" class="quiet" hidden>清除档案</button></div>
  </section>
  <p id="notice" role="status" hidden></p>
  <section aria-label="岗位列表">
    <div class="heading"><h2>岗位列表</h2><span id="count" aria-live="polite"></span></div>
    <div class="filters">
      <label>企业或岗位<input id="search" type="search" placeholder="搜索企业、岗位"></label>
      <label>地点<select id="city"><option value="">全部地点</option></select></label>
      <label>最低匹配分<input id="minimum" type="number" min="0" max="100" step="1" placeholder="不限"></label>
      <label>投递状态<select id="status"><option value="">全部状态</option><option>未投递</option><option>已投递</option><option>跳过</option><option>失败</option></select></label>
      <label>排序<select id="sort"><option value="score">匹配分从高到低</option><option value="city">按地点</option><option value="company">按企业</option><option value="source">牛客列表顺序</option></select></label>
      <label class="check"><input id="only" type="checkbox"> 只看待投清单</label>
    </div>
    <div id="cards" class="cards"></div>
  </section>
  <footer>匹配分基于 JD 关键词与单份简历的覆盖情况。招聘资格、岗位是否仍开放及提交结果，以招聘页面为准。</footer>
</main>
<dialog id="apply-dialog">
  <div id="apply-content"></div>
  <form method="dialog"><button class="quiet">关闭</button></form>
</dialog>
</body>
</html>
